# The php:8.3-apache base image ships conf-enabled/docker-php.conf, which sets
# "DirectoryIndex index.php index.html" (PHP first). This file is copied in
# after it (conf-enabled loads alphabetically; "z-" sorts last) to override it.
#
# DirectoryIndex is cumulative within the same scope in Apache: a later
# directive APPENDS to the list instead of replacing it, so "disabled" must
# clear it first (the same idiom docker-php.conf itself uses) before setting
# index.html first.
DirectoryIndex disabled
DirectoryIndex index.html index.php
