<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Phone showing a sales conversation, with a checklist note beside it">
  <rect width="800" height="500" fill="#E3ECE9"/>

  <!-- phone body -->
  <rect x="270" y="36" width="260" height="440" rx="36" fill="#101A24"/>
  <!-- screen -->
  <rect x="288" y="76" width="224" height="360" rx="14" fill="#FFFFFF"/>
  <rect x="288" y="76" width="224" height="46" rx="14" fill="#0E5E5B"/>
  <rect x="288" y="104" width="224" height="18" fill="#0E5E5B"/>
  <circle cx="320" cy="99" r="8" fill="#F5B731"/>
  <rect x="338" y="94" width="110" height="10" rx="5" fill="#CFE3DF"/>

  <!-- chat bubbles -->
  <rect x="304" y="142" width="150" height="40" rx="12" fill="#E3ECE9"/>
  <rect x="330" y="194" width="150" height="46" rx="12" fill="#0E5E5B"/>
  <rect x="304" y="252" width="170" height="40" rx="12" fill="#E3ECE9"/>
  <rect x="304" y="304" width="110" height="24" rx="10" fill="#F5B731"/>

  <!-- home bar -->
  <rect x="380" y="438" width="40" height="6" rx="3" fill="#56636E"/>

  <!-- checklist note -->
  <g transform="rotate(-4 660 250)">
    <rect x="560" y="160" width="190" height="200" fill="#F5B731" stroke="#101A24" stroke-width="5"/>
    <rect x="590" y="140" width="60" height="28" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
    <g fill="none" stroke="#101A24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="586" y="200" width="22" height="22" fill="#FFFFFF"/>
      <path d="M590 212 l6 6 l12 -14"/>
      <rect x="586" y="238" width="22" height="22" fill="#FFFFFF"/>
      <path d="M590 250 l6 6 l12 -14"/>
      <rect x="586" y="276" width="22" height="22" fill="#FFFFFF"/>
    </g>
    <rect x="620" y="206" width="100" height="10" fill="#101A24"/>
    <rect x="620" y="244" width="84" height="10" fill="#101A24"/>
    <rect x="620" y="282" width="100" height="10" fill="#101A24"/>
  </g>
</svg>
