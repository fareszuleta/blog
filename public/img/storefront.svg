<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Illustration of a small shop front with a striped awning, shelves of boxes and a shopping cart">
  <rect width="1200" height="520" fill="#E3ECE9"/>
  <circle cx="1040" cy="96" r="44" fill="#F5B731"/>

  <!-- building -->
  <rect x="170" y="160" width="860" height="290" fill="#FFFFFF" stroke="#101A24" stroke-width="6"/>

  <!-- sign -->
  <rect x="330" y="92" width="540" height="58" fill="#101A24"/>
  <text x="600" y="132" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#F4F6F5" text-anchor="middle">Shop</text>

  <!-- striped awning -->
  <g stroke="#101A24" stroke-width="4">
    <rect x="150" y="150" width="90" height="58" fill="#0E5E5B"/>
    <rect x="240" y="150" width="90" height="58" fill="#FFFFFF"/>
    <rect x="330" y="150" width="90" height="58" fill="#0E5E5B"/>
    <rect x="420" y="150" width="90" height="58" fill="#FFFFFF"/>
    <rect x="510" y="150" width="90" height="58" fill="#0E5E5B"/>
    <rect x="600" y="150" width="90" height="58" fill="#FFFFFF"/>
    <rect x="690" y="150" width="90" height="58" fill="#0E5E5B"/>
    <rect x="780" y="150" width="90" height="58" fill="#FFFFFF"/>
    <rect x="870" y="150" width="90" height="58" fill="#0E5E5B"/>
    <rect x="960" y="150" width="90" height="58" fill="#FFFFFF"/>
  </g>
  <rect x="150" y="208" width="900" height="12" fill="#F5B731" stroke="#101A24" stroke-width="4"/>

  <!-- left window: shelves with boxes -->
  <rect x="220" y="250" width="240" height="130" fill="#CFE3DF" stroke="#101A24" stroke-width="5"/>
  <line x1="220" y1="315" x2="460" y2="315" stroke="#101A24" stroke-width="4"/>
  <rect x="240" y="280" width="46" height="35" fill="#F5B731"/>
  <rect x="296" y="272" width="54" height="43" fill="#0E5E5B"/>
  <rect x="360" y="284" width="42" height="31" fill="#F5B731"/>
  <rect x="412" y="276" width="36" height="39" fill="#0E5E5B"/>
  <rect x="240" y="330" width="60" height="40" fill="#0E5E5B"/>
  <rect x="312" y="336" width="48" height="34" fill="#F5B731"/>
  <rect x="372" y="326" width="70" height="44" fill="#F5B731"/>

  <!-- right window: product tags -->
  <rect x="740" y="250" width="240" height="130" fill="#CFE3DF" stroke="#101A24" stroke-width="5"/>
  <circle cx="800" cy="300" r="22" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <circle cx="800" cy="300" r="5" fill="#FFFFFF"/>
  <circle cx="870" cy="330" r="22" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <circle cx="870" cy="330" r="5" fill="#FFFFFF"/>
  <circle cx="930" cy="296" r="22" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <circle cx="930" cy="296" r="5" fill="#FFFFFF"/>

  <!-- door -->
  <rect x="540" y="276" width="120" height="174" fill="#0E5E5B" stroke="#101A24" stroke-width="5"/>
  <rect x="558" y="296" width="84" height="60" fill="#CFE3DF" stroke="#101A24" stroke-width="4"/>
  <circle cx="644" cy="390" r="6" fill="#F5B731"/>

  <!-- potted plant -->
  <rect x="112" y="380" width="54" height="70" fill="#101A24"/>
  <ellipse cx="110" cy="360" rx="30" ry="18" fill="#0E5E5B" transform="rotate(-25 110 360)"/>
  <ellipse cx="148" cy="352" rx="30" ry="18" fill="#0E5E5B" transform="rotate(20 148 352)"/>
  <ellipse cx="128" cy="332" rx="22" ry="14" fill="#F5B731"/>

  <!-- shopping cart on the pavement -->
  <line x1="880" y1="360" x2="904" y2="384" stroke="#101A24" stroke-width="7" stroke-linecap="round"/>
  <polygon points="904,380 1034,380 1012,438 920,438" fill="#F5B731" stroke="#101A24" stroke-width="5" stroke-linejoin="round"/>
  <line x1="904" y1="380" x2="1034" y2="380" stroke="#101A24" stroke-width="5"/>
  <circle cx="940" cy="476" r="16" fill="#101A24"/>
  <circle cx="1000" cy="476" r="16" fill="#101A24"/>
  <circle cx="940" cy="476" r="5" fill="#F4F6F5"/>
  <circle cx="1000" cy="476" r="5" fill="#F4F6F5"/>

  <!-- pavement -->
  <rect x="0" y="450" width="1200" height="70" fill="#C9D6D1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#101A24" stroke-width="4"/>
</svg>
