<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Shelves stocked with boxes and a price tag">
  <rect width="800" height="500" fill="#E3ECE9"/>

  <!-- wall panel -->
  <rect x="60" y="60" width="680" height="380" fill="#FFFFFF" stroke="#101A24" stroke-width="5"/>

  <!-- shelves -->
  <rect x="90" y="170" width="620" height="14" fill="#101A24"/>
  <rect x="90" y="300" width="620" height="14" fill="#101A24"/>
  <rect x="90" y="430" width="620" height="14" fill="#101A24"/>

  <!-- top shelf boxes -->
  <rect x="110" y="110" width="80" height="60" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="200" y="96" width="70" height="74" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <rect x="280" y="120" width="96" height="50" fill="#FFFFFF" stroke="#101A24" stroke-width="4"/>
  <rect x="300" y="130" width="56" height="8" fill="#0E5E5B"/>
  <rect x="396" y="104" width="64" height="66" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="470" y="118" width="88" height="52" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <rect x="568" y="90" width="84" height="80" fill="#F5B731" stroke="#101A24" stroke-width="4"/>

  <!-- middle shelf boxes -->
  <rect x="110" y="240" width="96" height="60" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <rect x="216" y="222" width="60" height="78" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="286" y="250" width="110" height="50" fill="#FFFFFF" stroke="#101A24" stroke-width="4"/>
  <rect x="306" y="262" width="70" height="8" fill="#F5B731"/>
  <rect x="406" y="232" width="74" height="68" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <rect x="490" y="248" width="60" height="52" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="560" y="214" width="92" height="86" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>

  <!-- bottom shelf boxes -->
  <rect x="110" y="354" width="120" height="76" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="240" y="370" width="80" height="60" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>
  <rect x="330" y="340" width="70" height="90" fill="#FFFFFF" stroke="#101A24" stroke-width="4"/>
  <rect x="350" y="360" width="30" height="8" fill="#0E5E5B"/>
  <rect x="410" y="360" width="100" height="70" fill="#F5B731" stroke="#101A24" stroke-width="4"/>
  <rect x="520" y="346" width="132" height="84" fill="#0E5E5B" stroke="#101A24" stroke-width="4"/>

  <!-- price tag -->
  <g transform="translate(640 36) rotate(8)">
    <polygon points="0,0 120,0 150,40 120,80 0,80" fill="#F5B731" stroke="#101A24" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="22" cy="40" r="8" fill="#FFFFFF" stroke="#101A24" stroke-width="3"/>
    <rect x="48" y="26" width="76" height="10" fill="#101A24"/>
    <rect x="48" y="46" width="52" height="10" fill="#101A24"/>
  </g>
</svg>
