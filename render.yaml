# Render Blueprint: deploys the Docker image in this repo with a persistent disk for SQLite.
# Steps: Render dashboard -> New -> Blueprint -> select this GitHub repo.
# Then set ADMIN_PASSWORD in the dashboard (it is never stored in this file).
services:
  - type: web
    name: closing-notes
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # persistent disks require a paid plan
    healthCheckPath: /index.php
    envVars:
      - key: ADMIN_PASSWORD
        sync: false          # secret: set in the Render dashboard
      - key: RESEND_API_KEY
        sync: false          # secret: set in the Render dashboard — get from resend.com/api-keys
      - key: NTFY_TOPIC
        sync: false          # optional: custom ntfy.sh topic for push alerts
    disk:
      name: sqlite-data
      mountPath: /var/www/data
      sizeGB: 1
